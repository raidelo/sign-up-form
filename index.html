<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-up Form</title>
    <style>
      @font-face {
        src: url("./assets/NorseBold.otf");
        font-family: "NorseBold";
      }

      :root {
        --main-left-padding: 1.8rem;
        --shadow-color: hsl(0, 0%, 75%);
        --green: #596d48;
        --input-border: #e5e7eb;
        --input-border-selected: hsl(240, 100%, 75%);
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
      }

      main {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        font-size: 0.8rem;
      }

      #hero {
        display: flex;
        flex-direction: column;
        min-width: 37vw;
        min-height: 100vh;
        background-image: url("./assets/halie-west.jpg");
        background-size: cover;
        background-position: top;
        padding-top: 12%;
      }

      #title {
        font-size: 3rem;
        font-family: "NorseBold";
        padding: 0.25em;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0008;
      }

      #logo {
        height: 1.3em;
      }

      #hero-credits {
        margin: auto auto 0.5rem;
        color: white;
        font-size: 0.4rem;
      }

      #hero-credits > a {
        color: inherit;
      }

      #description {
        font-weight: bold;
        background-color: hsl(0, 0%, 97%);
        padding: 3rem 3rem 1.4rem var(--main-left-padding);
      }

      h1 {
        font-size: inherit;
      }

      #form {
        padding-left: var(--main-left-padding);
      }

      .input-row,
      .input-row > div {
        display: flex;
      }

      .input-row > div {
        flex-direction: column;
        gap: 2px;
      }

      .input-row {
        margin-bottom: 10px;
        gap: 20px;
      }

      #form label {
        font-family: monospace;
        letter-spacing: 0.5px;
        font-size: 0.5em;
        font-weight: bold;
        color: hsl(0, 0%, 45%);
      }

      #form input {
        border: 1px solid var(--input-border);
        border-radius: 4px;
      }

      #form input:focus {
        outline: 1px solid var(--input-border-selected);
        box-shadow: 0 0 3px black;
      }

      #upper {
        padding-bottom: 2rem;
        box-shadow: 0 1px 6px var(--shadow-color);
      }

      #actions {
        padding: 1.5rem 0 8rem var(--main-left-padding);
      }

      #actions > button {
        margin-bottom: 1.5rem;
        padding: 0.3rem 1.5rem;
        background-color: var(--green);
        border-radius: 4px;
        border-width: 0;
        color: white;
        box-shadow: 0 0 2px var(--shadow-color);
      }

      #log-in {
        text-decoration: none;
        color: var(--green);
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div id="title">
        <img id="logo" src="./assets/odin-lined.png" alt="Odin" />
        <span>ODIN</span>
      </div>

      <div id="hero-credits">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a href="https://unsplash.com/">Unsplash</a>
      </div>
    </div>

    <main>
      <div id="upper">
        <div id="description">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <em>now</em> to get started.
          </p>
          <p>You <em>know</em> you want to.</p>
        </div>
        <section id="form">
          <h1>Let's do this!</h1>
          <div class="input-row">
            <div>
              <label for="user_name">FIRST NAME</label>
              <input type="text" name="user_name" id="user_name" required />
            </div>
            <div>
              <label for="user_lastname">LAST NAME</label>
              <input
                type="text"
                name="user_lastname"
                id="user_lastname"
                required
              />
            </div>
          </div>
          <div class="input-row">
            <div>
              <label for="email">EMAIL</label>
              <input type="text" name="email" id="email" required />
            </div>
            <div>
              <label for="phone">PHONE NUMBER</label>
              <input type="text" name="phone" id="phone" required />
            </div>
          </div>
          <div class="input-row">
            <div>
              <label for="password">PASSWORD</label>
              <input type="text" name="password" id="password" required />
            </div>
            <div>
              <label for="password_confirmation">CONFIRM PASSWORD</label>
              <input
                type="text"
                name="password_confirmation"
                id="password_confirmation"
                required
              />
            </div>
          </div>
        </section>
      </div>
      <div id="actions">
        <button type="submit" form="form">Create Account</button>
        <div>Already have an account? <a id="log-in" href="#">Log in</a></div>
      </div>
    </main>
  </body>
</html>
