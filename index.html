<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-up Form</title>
    <style>
      @font-face {
        src: url("./assets/NorseBold.otf");
        font-family: "NorseBold";
      }

      body {
        margin: 0;
        padding: 0;
      }

      #hero {
        display: flex;
        flex-direction: column;
        width: 37vw;
        height: 100vh;
        background-image: url("./assets/halie-west.jpg");
        background-size: cover;
        background-position: top;
        padding-top: 12%;
      }

      #title {
        font-size: 3rem;
        font-family: "NorseBold";
        padding: 0.25em;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0008;
      }

      #logo {
        height: 1.3em;
      }

      #hero-credits {
        margin: auto auto 0.5rem;
        color: white;
        font-size: 0.4rem;
      }

      #hero-credits > a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div id="title">
        <img id="logo" src="./assets/odin-lined.png" alt="Odin" />
        <span>ODIN</span>
      </div>

      <div id="hero-credits">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a href="https://unsplash.com/">Unsplash</a>
      </div>
    </div>

    <div id="form"></div>
  </body>
</html>
