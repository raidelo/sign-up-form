<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign-up Form</title>
    <style>
      @font-face {
        src: url("./assets/NorseBold.otf");
        font-family: "NorseBold";
      }

      :root {
        --main-left-padding: 1.8rem;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
      }

      #hero {
        display: flex;
        flex-direction: column;
        min-width: 37vw;
        min-height: 100vh;
        background-image: url("./assets/halie-west.jpg");
        background-size: cover;
        background-position: top;
        padding-top: 12%;
      }

      #title {
        font-size: 3rem;
        font-family: "NorseBold";
        padding: 0.25em;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0008;
      }

      #logo {
        height: 1.3em;
      }

      #hero-credits {
        margin: auto auto 0.5rem;
        color: white;
        font-size: 0.4rem;
      }

      #hero-credits > a {
        color: inherit;
      }

      #description {
        font-size: 0.8rem;
        background-color: hsl(0, 0%, 97%);
        padding: 3rem 3rem 1.4rem var(--main-left-padding);
      }

      section#form,
      #actions {
        padding-left: var(--main-left-padding);
      }

      section#form > div,
      section#form > div > div {
        display: flex;
      }

      section#form > div > div {
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="hero">
      <div id="title">
        <img id="logo" src="./assets/odin-lined.png" alt="Odin" />
        <span>ODIN</span>
      </div>

      <div id="hero-credits">
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a href="https://unsplash.com/">Unsplash</a>
      </div>
    </div>

    <main>
      <div id="description">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <section id="form">
        <h1>Let's do this!</h1>
        <div>
          <div>
            <label for="user_name">FIRST NAME</label>
            <input type="text" name="user_name" id="user_name" />
          </div>
          <div>
            <label for="user_lastname">LAST NAME</label>
            <input type="text" name="user_lastname" id="user_lastname" />
          </div>
        </div>
        <div>
          <div>
            <label for="email">EMAIL</label>
            <input type="text" name="email" id="email" />
          </div>
          <div>
            <label for="phone">PHONE NUMBER</label>
            <input type="text" name="phone" id="phone" />
          </div>
        </div>
        <div>
          <div>
            <label for="password">PASSWORD</label>
            <input type="text" name="password" id="password" />
          </div>
          <div>
            <label for="password_confirmation">CONFIRM PASSWORD</label>
            <input
              type="text"
              name="password_confirmation"
              id="password_confirmation"
            />
          </div>
        </div>
      </section>
      <div id="actions">
        <button type="submit" form="form">Create Account</button>
        <div>Already have an account? <a href="#">Log in</a></div>
      </div>
    </main>
  </body>
</html>
